<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USD/JPY FX Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --up: #1D9E75;
    --down: #E24B4A;
    --blue: #378ADD;
    --bg: #0e131a;
    --panel: #161d27;
    --panel2: #1d2632;
    --line: #2a3440;
    --txt: #e8edf2;
    --muted: #93a1b0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.5;
    padding: 16px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }

  /* ヘッダー */
  header {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 14px;
    padding: 16px 18px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; margin-bottom: 16px;
  }
  .price { font-size: 38px; font-weight: 700; letter-spacing: -0.5px; }
  .price .unit { font-size: 18px; color: var(--muted); margin-left: 4px; font-weight: 500; }
  .change { font-size: 16px; font-weight: 600; }
  .badge {
    font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
    background: var(--panel2); color: var(--muted);
  }
  .badge.live { background: #E1F5EE; color: #0F6E56; }
  .badge.pseudo { background: #FAEEDA; color: #854F0B; }
  .updated { margin-left: auto; font-size: 12px; color: var(--muted); }

  .pos { color: var(--up); }
  .neg { color: var(--down); }

  /* メトリクスカード */
  .metrics {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
  }
  .card .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .card .val { font-size: 24px; font-weight: 700; }

  /* セクション */
  .section-title { font-size: 15px; font-weight: 700; margin: 8px 0 10px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 18px;
  }

  /* 時間軸ボタン */
  .tfbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .tfbtn {
    background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 16px; font-size: 13px; cursor: pointer; font-weight: 600;
    transition: all .15s;
  }
  .tfbtn:hover { border-color: var(--blue); }
  .tfbtn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

  /* チャート */
  /* リアル/予想チャートを左右1:1で並べる */
  .charts-1to1 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  .chart-col { min-width: 0; }
  .chart-area { position: relative; height: 360px; }
  #boundary {
    position: absolute; top: 0; width: 0; border-left: 2px dashed rgba(255,180,0,0.6);
    pointer-events: none;
  }
  #boundary-label {
    position: absolute; top: 4px; transform: translateX(-50%);
    font-size: 11px; color: rgba(255,180,0,0.95); white-space: nowrap;
    background: rgba(14,19,26,0.7); padding: 2px 6px; border-radius: 4px; pointer-events: none;
  }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .legend .item { display: flex; align-items: center; gap: 6px; }
  .legend .sw { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  .dev-readout { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .dev-readout b { font-variant-numeric: tabular-nums; }
  /* 予想サマリー（分かりやすさ重視の大きめ表示） */
  .forecast-summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; margin-bottom: 12px; padding: 10px 12px; background: var(--panel2); border-radius: 10px; font-size: 14px; }
  .forecast-summary .arrow { font-size: 20px; font-weight: 700; }
  .forecast-summary .target { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .forecast-summary .sub { color: var(--muted); font-size: 12px; }

  /* センチメントバー */
  .sentiment { display: flex; height: 34px; border-radius: 8px; overflow: hidden; margin-bottom: 4px; }
  .sentiment .buy { background: var(--up); }
  .sentiment .sell { background: var(--down); }
  .sentiment span {
    display: flex; align-items: center; justify-content: center; color: #fff;
    font-size: 13px; font-weight: 700; transition: width 0.6s ease;
  }
  .sentiment-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

  /* 2カラム */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

  /* 価格帯分布 */
  .dist-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; font-size: 12px; }
  .dist-row .rng { width: 130px; color: var(--muted); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .dist-row .track { flex: 1; background: var(--panel2); border-radius: 5px; height: 18px; overflow: hidden; }
  .dist-row .fill { height: 100%; background: var(--blue); border-radius: 5px; transition: width 0.5s ease; }
  .dist-row .cnt { width: 64px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .dist-row.cur .rng { color: rgba(255,180,0,0.95); font-weight: 700; }
  .dist-row.cur .fill { background: rgba(255,180,0,0.8); }

  /* 損益サマリー */
  .pl-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .pl-row:last-child { border-bottom: none; }
  .pl-row .k { color: var(--muted); }
  .pl-row .v { font-weight: 700; font-variant-numeric: tabular-nums; }

  /* テーブル */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.mono, th.mono { font-family: "SF Mono", Consolas, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .num { text-align: right; }
  .dirbadge { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
  .dirbadge.buy { background: rgba(29,158,117,0.18); color: var(--up); }
  .dirbadge.sell { background: rgba(226,75,74,0.18); color: var(--down); }
  .typebadge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--panel2); color: var(--muted); white-space: nowrap; }
  .typebadge.scalper { color: #5bbcff; }
  .typebadge.dayTrader { color: #7dd3a8; }
  .typebadge.swingTrader { color: #c8a8ff; }
  .typebadge.gambler { color: #ffb347; }
  .typebadge.pro { color: #ffd700; }
  .table-scroll { overflow-x: auto; }

  /* 操作ボタン */
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .btn {
    background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 18px; font-size: 13px; cursor: pointer; font-weight: 600;
    transition: all .15s;
  }
  .btn:hover { border-color: var(--blue); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .key-status { display: inline-flex; align-items: center; font-size: 12px; color: var(--muted); }

  @media (max-width: 760px) {
    .metrics { grid-template-columns: repeat(2, 1fr); }
    .grid2 { grid-template-columns: 1fr; }
    .charts-1to1 { grid-template-columns: 1fr; }
    .price { font-size: 30px; }
    .dist-row .rng { width: 96px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ヘッダー -->
  <header>
    <div class="price"><span id="h-price">---.---</span><span class="unit">円</span></div>
    <div class="change" id="h-change">--</div>
    <div class="badge" id="h-badge">⏳ 取得中</div>
    <div class="updated" id="h-updated">最終更新: --:--:--</div>
  </header>

  <!-- メトリクスカード -->
  <div class="metrics">
    <div class="card"><div class="label">総トレーダー</div><div class="val" id="m-total">50,000</div></div>
    <div class="card"><div class="label">買い</div><div class="val pos" id="m-buy">--</div></div>
    <div class="card"><div class="label">売り</div><div class="val neg" id="m-sell">--</div></div>
    <div class="card"><div class="label">勝率</div><div class="val" id="m-win">--%</div></div>
  </div>

  <!-- リアル/予想チャート（左右1:1） -->
  <div class="charts-1to1">

    <!-- リアルタイムチャート -->
    <div class="chart-col">
      <div class="section-title">リアルタイム ドル円（5分足・実績）</div>
      <div class="panel">
        <div class="chart-area">
          <canvas id="chart-live"></canvas>
        </div>
        <div class="legend">
          <div class="item"><span class="sw" style="background:rgba(29,158,117,0.85)"></span>陽線</div>
          <div class="item"><span class="sw" style="background:rgba(226,75,74,0.85)"></span>陰線</div>
          <div class="item">実際の値動き・3秒ごと更新</div>
        </div>
      </div>
    </div>

    <!-- 予想チャート -->
    <div class="chart-col">
      <div class="section-title">予想 ドル円（5分足・自己学習）</div>
      <div class="panel">
        <div class="forecast-summary" id="forecast-summary"></div>
        <div class="chart-area">
          <canvas id="chart-pred"></canvas>
          <div id="boundary"></div>
          <div id="boundary-label">← 実績 │ 予想 →</div>
        </div>
        <div class="legend">
          <div class="item"><span class="sw" style="background:rgba(29,158,117,0.85)"></span>実績 陽線</div>
          <div class="item"><span class="sw" style="background:rgba(226,75,74,0.85)"></span>実績 陰線</div>
          <div class="item"><span class="sw" style="background:rgba(29,158,117,0.35)"></span>予想 陽線</div>
          <div class="item"><span class="sw" style="background:rgba(226,75,74,0.35)"></span>予想 陰線</div>
        </div>
        <div class="dev-readout" id="dev-readout"></div>
      </div>
    </div>

  </div>

  <!-- センチメントバー -->
  <div class="section-title">市場センチメント</div>
  <div class="panel">
    <div class="sentiment">
      <span class="buy" id="s-buy" style="width:50%">買い 50%</span>
      <span class="sell" id="s-sell" style="width:50%">売り 50%</span>
    </div>
    <div class="sentiment-legend"><span>買い (Long)</span><span>売り (Short)</span></div>
  </div>

  <!-- 2カラム -->
  <div class="grid2">
    <div>
      <div class="section-title">建値ヒートマップ（ポジション集中帯）</div>
      <div class="panel" id="dist"></div>
    </div>
    <div>
      <div class="section-title">損益サマリー</div>
      <div class="panel" id="plsummary"></div>
    </div>
  </div>

  <!-- トレーダーリスト -->
  <div class="section-title">トレーダーリスト（損益上位20件）</div>
  <div class="panel table-scroll">
    <table>
      <thead>
        <tr>
          <th class="mono">ID</th><th>タイプ</th><th>方向</th><th class="mono num">エントリー</th>
          <th class="num">ロット</th><th class="mono num">損益(円)</th><th>状態</th>
        </tr>
      </thead>
      <tbody id="tlist"></tbody>
    </table>
  </div>

  <!-- 操作ボタン -->
  <div class="actions">
    <button class="btn primary" id="btn-refresh">↻ 手動更新</button>
    <button class="btn" id="btn-key">キー設定</button>
    <span class="key-status" id="key-status"></span>
  </div>

</div>

<script>
/* ===================== 定数 ===================== */
const TOTAL = 50000;
const REAL_COUNT = 48;      // 実績足の保持本数
const FORECAST_COUNT = 12;  // 予想足の本数
const LEARN_RATE = 0.2;     // ドリフト学習率（EMA）
const C_UP_F = 'rgba(29,158,117,0.35)'; // 予想 陽線（半透明）
const C_DN_F = 'rgba(226,75,74,0.35)';  // 予想 陰線（半透明）
const C_UP_R = 'rgba(29,158,117,0.85)'; // 実績 陽線（不透明）
const C_DN_R = 'rgba(226,75,74,0.85)';  // 実績 陰線（不透明）

// Twelve Data（リアルタイム5分足の取得元）
const TD_BASE = 'https://api.twelvedata.com/time_series';
const TD_SYMBOL = 'USD/JPY';
const TD_INTERVAL = '5min';
const FREE_DAILY_LIMIT = 800; // 無料プランの1日あたり呼び出し上限
// 無料枠を1日で均等配分した自動更新間隔（86400秒 ÷ 800 ≒ 108秒）
const POLL_MS = Math.ceil(86400 / FREE_DAILY_LIMIT) * 1000;
const TD_KEY_STORE = 'td-api-key';

/* ===================== 状態 ===================== */
let livePrice = 155.342;
let rateStatus = 'loading'; // 'live' | 'pseudo' | 'loading'
let tfMin = 5;              // 5分足固定（私用）
let realCandles = [];       // 実績足（履歴＋形成中）。一度作ったら作り直さず連続
let forecastCandles = [];   // 予想足（実績とのズレを観測して引き直す）
let drift = 0;              // 1足あたりの予想変化（学習値）
let lastDeviation = 0;      // 直近の予想ずれ（実績close − 予想close）
let mae = 0, maeN = 0;      // 予想の平均絶対誤差（学習指標）
let traders = [];
let chartLive = null;       // リアルタイムチャート（実績足のみ）
let chartPred = null;       // 予想チャート（実績＋予想）
let dataSource = 'synthetic'; // 'twelvedata' | 'synthetic'
let lastClosedBucket = null;  // 直近で確定した足のバケット（誤差観測用）
let tdError = '';             // Twelve Data のエラーメッセージ
let lastPollAt = 0;           // 最後にAPI取得した時刻
let pollTimer = null;

/* ===================== 為替レート取得 ===================== */
async function fetchLiveRate() {
  const urls = [
    'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json',
    'https://latest.currency-api.pages.dev/v1/currencies/usd.min.json'
  ];
  for (const url of urls) {
    try {
      const r = await fetch(url);
      if (!r.ok) continue;
      const d = await r.json();
      if (d?.usd?.jpy) return parseFloat(d.usd.jpy.toFixed(3));
    } catch(e) {}
  }
  return null; // 失敗時は疑似レートにフォールバック
}

/* ===================== Twelve Data（実際の5分足） ===================== */
const getApiKey = () => { try { return localStorage.getItem(TD_KEY_STORE) || ''; } catch (e) { return ''; } };
const setApiKey = k => { try { localStorage.setItem(TD_KEY_STORE, k); } catch (e) {} };

// USD/JPY の5分足を REAL_COUNT 本取得（成功時は古い順のローソク足配列、失敗時 null）
async function fetchTwelveData() {
  const key = getApiKey();
  if (!key) return null;
  const url = `${TD_BASE}?symbol=${encodeURIComponent(TD_SYMBOL)}&interval=${TD_INTERVAL}`
    + `&outputsize=${REAL_COUNT}&timezone=UTC&format=JSON&apikey=${encodeURIComponent(key)}`;
  try {
    const r = await fetch(url);
    const d = await r.json();
    if (d.status === 'error' || !Array.isArray(d.values)) { tdError = d.message || 'APIエラー'; return null; }
    tdError = '';
    // values は新しい順 → 古い順に並べ替え、内部のローソク足形式へ変換
    const candles = d.values.slice().reverse().map(v => {
      const t = new Date(v.datetime.replace(' ', 'T') + 'Z').getTime();
      return {
        bucket: Math.floor(t / BUCKET_MS()), t,
        o: r3(+v.open), h: r3(+v.high), l: r3(+v.low), c: r3(+v.close), forming: false
      };
    });
    candles[candles.length - 1].forming = true; // 最新足は形成中扱い
    return candles;
  } catch (e) { tdError = '通信エラー'; return null; }
}

// 取得した実データを取り込み、予想とのズレを観測してドリフトを学習
function ingestRealCandles(apiCandles) {
  realCandles = apiCandles;
  livePrice = realCandles[realCandles.length - 1].c;
  if (realCandles.length >= 2) {
    const closed = realCandles[realCandles.length - 2]; // 直近で確定した足
    const realized = closed.c - closed.o;
    if (lastClosedBucket !== null && closed.bucket !== lastClosedBucket) {
      const err = realized - drift; // 予想していた変化との誤差
      lastDeviation = r3(closed.c - (closed.o + drift));
      maeN++; mae = mae + (Math.abs(err) - mae) / maeN;
    }
    drift = drift + LEARN_RATE * (realized - drift);
    lastClosedBucket = closed.bucket;
  }
}

/* ===================== ロウソク足（実績の連続保持＋適応予想） ===================== */
const r3 = v => parseFloat(v.toFixed(3));
const BUCKET_MS = () => tfMin * 60 * 1000;          // 5分足の1バケット長
const bucketOf = t => Math.floor(t / BUCKET_MS());  // 時刻→バケットID

// 初回のみ: 実績の履歴を生成（以降は作り直さず連続させる）
function seedRealCandles(basePrice) {
  realCandles = [];
  lastClosedBucket = null; // 作り直し時は誤差観測の連続性をリセット
  const k = Math.sqrt(tfMin);
  const nowB = bucketOf(Date.now());
  // 過去にさかのぼった始点から、basePrice まで自然に到達させる
  let price = basePrice - (Math.random() * 0.8 + 0.2);
  for (let i = REAL_COUNT - 1; i >= 0; i--) {
    const o = price;
    const c = (i === 0) ? basePrice : o + (Math.random() * 2 - 1) * 0.07 * k;
    const h = Math.max(o, c) + Math.random() * 0.035 * k;
    const l = Math.min(o, c) - Math.random() * 0.035 * k;
    const b = nowB - i;
    realCandles.push({ bucket: b, o: r3(o), h: r3(h), l: r3(l), c: r3(c), t: b * BUCKET_MS(), forming: i === 0 });
    price = c;
  }
}

// 足が確定するたびに「予想 vs 実績」の誤差を観測し、ドリフトを学習
function commitAndLearn(candle) {
  candle.forming = false;
  const realized = candle.c - candle.o; // この足で実際に動いた幅
  const predicted = drift;              // 予想していた1足の変化
  const err = realized - predicted;
  lastDeviation = r3(candle.c - (candle.o + predicted)); // 実績close − 予想close
  drift = drift + LEARN_RATE * (realized - drift);       // ドリフトを実現値へ寄せる
  maeN++; mae = mae + (Math.abs(err) - mae) / maeN;      // 平均絶対誤差を更新
}

// livePrice を形成中の足へ反映。バケットが進んでいれば確定→新足をロール
function syncForming() {
  const nowB = bucketOf(Date.now());
  let cur = realCandles[realCandles.length - 1];
  // 長時間アイドル後の持ち越しは作り直す（追従スパイク＋カラ足の空白を防ぐ）
  if (nowB - cur.bucket > 3) { seedRealCandles(livePrice); return; }
  while (cur.bucket < nowB) {
    commitAndLearn(cur);
    const o = cur.c;
    cur = { bucket: cur.bucket + 1, o, h: o, l: o, c: o, t: (cur.bucket + 1) * BUCKET_MS(), forming: true };
    realCandles.push(cur);
    if (realCandles.length > REAL_COUNT) realCandles.shift();
  }
  cur.c = livePrice;
  cur.h = r3(Math.max(cur.h, livePrice, cur.o));
  cur.l = r3(Math.min(cur.l, livePrice, cur.o));
}

// 学習済みドリフトで未来の予想足を引き直す（地平が遠いほど不確実性コーンを広げる）
function rebuildForecast() {
  const cur = realCandles[realCandles.length - 1];
  const k = Math.sqrt(tfMin);
  forecastCandles = [];
  let o = cur.c;
  for (let i = 0; i < FORECAST_COUNT; i++) {
    const c = o + drift;
    const band = (0.02 + 0.012 * i) * k; // 先になるほど広いヒゲ＝不確実性
    const h = Math.max(o, c) + band;
    const l = Math.min(o, c) - band;
    forecastCandles.push({ o: r3(o), h: r3(h), l: r3(l), c: r3(c), t: (cur.bucket + 1 + i) * BUCKET_MS(), forecast: true });
    o = c;
  }
}

function predCandles() { return realCandles.concat(forecastCandles); }

/* ===================== 状態の永続化（リロードしても同じチャート） ===================== */
const STORE_KEY = 'fx-dashboard-state-v2';

function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      tfMin, realCandles, drift, mae, maeN, lastClosedBucket
    }));
  } catch (e) {}
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (!s || s.tfMin !== tfMin || !Array.isArray(s.realCandles) || s.realCandles.length === 0) return false;
    realCandles = s.realCandles;
    drift = s.drift || 0;
    mae = s.mae || 0;
    maeN = s.maeN || 0;
    lastClosedBucket = s.lastClosedBucket ?? null;
    return true;
  } catch (e) { return false; }
}

/* ===================== トレーダー生成 ===================== */
// ロット重み付きテーブル（小ロット=初心者を多数派に、大口を少数派に）
const LOT_TABLE = [
  { lot: 0.1, weight: 30 },
  { lot: 0.2, weight: 20 },
  { lot: 0.3, weight: 10 },
  { lot: 0.5, weight: 15 },
  { lot: 1.0, weight: 15 },
  { lot: 2.0, weight: 7 },
  { lot: 5.0, weight: 3 }
];

// トレーダータイプ: 出現率 + タイプ別エントリー距離 + ロット倍率
const TYPE_TABLE = [
  { type: 'scalper',     label: 'スキャル',     weight: 40, dist: 0.10 },
  { type: 'dayTrader',   label: 'デイ',         weight: 30, dist: 0.50 },
  { type: 'swingTrader', label: 'スイング',     weight: 15, dist: 3.00 },
  { type: 'gambler',     label: 'ギャンブラー', weight: 10, dist: 1.00, lotMul: 2 },
  { type: 'pro',         label: 'プロ',         weight: 5,  dist: 0.30 }
];

const WIN_RATIO = 0.25; // 含み益トレーダーの目標割合（利益25% / 損失75%）

// 重み付き抽選（テーブルは weight プロパティを持つ）
function pickWeighted(table) {
  let total = 0;
  for (const e of table) total += e.weight;
  let r = Math.random() * total;
  for (const e of table) { if ((r -= e.weight) < 0) return e; }
  return table[table.length - 1];
}

// 正規分布乱数（Box-Muller）
function gaussianRandom(mean = 0, sigma = 1) {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return mean + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function genTraders() {
  const arr = new Array(TOTAL);
  const p = livePrice;
  for (let i = 0; i < TOTAL; i++) {
    const tp = pickWeighted(TYPE_TABLE);
    const dir = Math.random() < 0.53 ? 'buy' : 'sell';

    // ロット: 重み付き抽選 → gambler は2倍
    let lot = pickWeighted(LOT_TABLE).lot;
    if (tp.lotMul) lot = parseFloat((lot * tp.lotMul).toFixed(1));

    // 含み益/含み損を先に決定（目標 25%:75%）し、建値の方向で整合させる
    const winner = Math.random() < WIN_RATIO;
    // タイプ別距離を sigma に反映し、現在価格付近へ集中させる（正規分布）
    const mag = Math.abs(gaussianRandom(0, tp.dist / 2));
    // buy:  勝ち = 建値が現在値より下 / sell: 勝ち = 建値が現在値より上
    const entryBelow = dir === 'buy' ? winner : !winner;
    let entry = entryBelow ? p - mag : p + mag;
    entry = Number(entry.toFixed(3));

    const pips = dir === 'buy' ? (p - entry) * 100 : (entry - p) * 100;
    let pl = Math.round(pips * lot * 100);
    // 丸めで0になった分を勝敗側へ寄せ、比率を保つ
    if (winner && pl <= 0) pl = 1;
    if (!winner && pl >= 0) pl = -1;

    // status は損益額と連動
    let status;
    if (pl >= 1000) status = 'TP待ち';
    else if (pl <= -1000) status = 'SL接近';
    else status = 'オープン';

    arr[i] = {
      id: 'T' + String(i + 1).padStart(5, '0'),
      type: tp.type,
      dir, entry, lot, pl, status
    };
  }
  traders = arr;
}

const TYPE_LABEL = Object.fromEntries(TYPE_TABLE.map(t => [t.type, t.label]));

/* ===================== チャート描画 ===================== */
// 任意のロウソク足配列から Chart.js 用データを構築
function buildDatasets(candles) {
  const wick = [], body = [];
  const wickColors = [], bodyColors = [];
  candles.forEach(cd => {
    const up = cd.c >= cd.o;
    const col = cd.forecast ? (up ? C_UP_F : C_DN_F) : (up ? C_UP_R : C_DN_R);
    wick.push([cd.l, cd.h]);
    body.push([cd.o, cd.c]);
    wickColors.push(col);
    bodyColors.push(col);
  });
  const labels = candles.map(cd => {
    const d = new Date(cd.t);
    const h = d.getHours(), m = d.getMinutes();
    return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
  });
  // y軸レンジ: ロウソク足が0基点に潰れないよう、安値〜高値に余白を付けて算出
  let lo = Infinity, hi = -Infinity;
  candles.forEach(cd => { if (cd.l < lo) lo = cd.l; if (cd.h > hi) hi = cd.h; });
  const pad = Math.max((hi - lo) * 0.08, 0.02);
  return { labels, wick, body, wickColors, bodyColors, yMin: lo - pad, yMax: hi + pad };
}

// ツールチップ: 実体(dataset[1])のみ・対象の足配列から OHLC を表示
function tooltipConfig(getCandles) {
  return {
    filter: item => item.datasetIndex === 1,
    callbacks: {
      title: items => {
        const cd = getCandles()[items[0].dataIndex];
        const tag = cd.forecast ? '【予想】' : '【実績】';
        return `${items[0].label} ${tag}`;
      },
      label: item => {
        const cd = getCandles()[item.dataIndex];
        return [
          `始値: ${cd.o.toFixed(3)}`,
          `高値: ${cd.h.toFixed(3)}`,
          `安値: ${cd.l.toFixed(3)}`,
          `終値: ${cd.c.toFixed(3)}`
        ];
      }
    }
  };
}

// 1チャートの生成（共通設定）
function makeChart(canvasId, getCandles, onComplete) {
  const { labels, wick, body, wickColors, bodyColors, yMin, yMax } = buildDatasets(getCandles());
  const ctx = document.getElementById(canvasId).getContext('2d');
  return new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'wick', data: wick, backgroundColor: wickColors, barPercentage: 0.15, categoryPercentage: 0.9, order: 2 },
        { label: 'body', data: body, backgroundColor: bodyColors, barPercentage: 0.6, categoryPercentage: 0.9, order: 1 }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 120, onComplete },
      scales: {
        y: { beginAtZero: false, min: yMin, max: yMax, ticks: { color: '#93a1b0', callback: v => v.toFixed(2) }, grid: { color: 'rgba(255,255,255,0.05)' } },
        x: { ticks: { color: '#93a1b0', maxTicksLimit: 10, autoSkip: true }, grid: { display: false } }
      },
      plugins: { legend: { display: false }, tooltip: tooltipConfig(getCandles) }
    }
  });
}

// 既存チャートのデータ更新
function updateChart(chart, getCandles) {
  const { labels, wick, body, wickColors, bodyColors, yMin, yMax } = buildDatasets(getCandles());
  chart.data.labels = labels;
  chart.data.datasets[0].data = wick;
  chart.data.datasets[0].backgroundColor = wickColors;
  chart.data.datasets[1].data = body;
  chart.data.datasets[1].backgroundColor = bodyColors;
  chart.options.scales.y.min = yMin;
  chart.options.scales.y.max = yMax;
  chart.update();
}

// 境界線プラグイン代わり: 予想チャートの chartArea から 50 本目位置を算出して div を配置
function positionBoundary() {
  if (!chartPred) return;
  const area = chartPred.chartArea;
  const xScale = chartPred.scales.x;
  if (!area || !xScale) return;
  // 実績と予想の境界 = 実績の最終足の直後
  const x = xScale.getPixelForValue(realCandles.length - 0.5);
  const bd = document.getElementById('boundary');
  const lb = document.getElementById('boundary-label');
  bd.style.left = x + 'px';
  bd.style.top = area.top + 'px';
  bd.style.height = (area.bottom - area.top) + 'px';
  lb.style.left = x + 'px';
}

function renderChart() {
  if (!chartLive) {
    chartLive = makeChart('chart-live', () => realCandles, null);
    chartPred = makeChart('chart-pred', () => predCandles(), positionBoundary);
  } else {
    updateChart(chartLive, () => realCandles);
    updateChart(chartPred, () => predCandles());
  }
  positionBoundary();
}

/* ===================== UI 更新 ===================== */
const fmt = n => n.toLocaleString('en-US');
const sign = n => (n >= 0 ? '+' : '') + fmt(n);

function updateUI() {
  const base = realCandles[0].o;
  const diff = livePrice - base;
  const pct = (diff / base) * 100;

  // ヘッダー
  document.getElementById('h-price').textContent = livePrice.toFixed(3);
  const ch = document.getElementById('h-change');
  ch.textContent = `${diff >= 0 ? '+' : ''}${diff.toFixed(3)}円 (${diff >= 0 ? '+' : ''}${pct.toFixed(2)}%)`;
  ch.className = 'change ' + (diff >= 0 ? 'pos' : 'neg');

  const badge = document.getElementById('h-badge');
  if (rateStatus === 'loading') { badge.textContent = '⏳ 取得中'; badge.className = 'badge pseudo'; }
  else if (dataSource === 'twelvedata') { badge.textContent = '🟢 Twelve Data ライブ'; badge.className = 'badge live'; }
  else { badge.textContent = tdError ? `⚠ 疑似データ（${tdError}）` : '⚠ 疑似データ'; badge.className = 'badge pseudo'; }

  const now = new Date();
  document.getElementById('h-updated').textContent =
    `最終更新: ${now.toTimeString().slice(0,8)}`;

  // 予想サマリー（現在 → 予想到達点。分かりやすさ重視の大きめ表示）
  const cur = livePrice;
  const target = forecastCandles.length ? forecastCandles[forecastCandles.length - 1].c : cur;
  const fdiff = target - cur;
  const horizonMin = FORECAST_COUNT * tfMin;
  const arrow = fdiff > 0.005 ? '↑' : (fdiff < -0.005 ? '↓' : '→');
  const fcls = fdiff > 0.005 ? 'pos' : (fdiff < -0.005 ? 'neg' : '');
  const trend = fdiff > 0.005 ? '上昇' : (fdiff < -0.005 ? '下落' : '横ばい');
  document.getElementById('forecast-summary').innerHTML =
    `<span class="sub">現在</span><span class="target">${cur.toFixed(3)}</span>` +
    `<span class="arrow ${fcls}">${arrow}</span>` +
    `<span class="sub">${horizonMin}分後の予想</span><span class="target ${fcls}">${target.toFixed(3)}</span>` +
    `<span class="${fcls}" style="font-weight:700">${fdiff >= 0 ? '+' : ''}${fdiff.toFixed(3)}円（${trend}）</span>`;

  // 予想とのズレ観測（学習ドリフト・直近ずれ・平均誤差）
  const driftYen = drift; // 1足(5分)あたりの予想変化
  const accuracy = maeN > 0 ? Math.max(0, 100 - mae * 1000) : null; // 誤差0.1円で約0%
  document.getElementById('dev-readout').innerHTML =
    `<span>予想ドリフト: <b class="${driftYen >= 0 ? 'pos' : 'neg'}">${driftYen >= 0 ? '+' : ''}${driftYen.toFixed(3)}円/5分</b></span>` +
    `<span>直近ずれ: <b class="${lastDeviation >= 0 ? 'pos' : 'neg'}">${lastDeviation >= 0 ? '+' : ''}${lastDeviation.toFixed(3)}円</b></span>` +
    `<span>平均誤差(MAE): <b>${maeN > 0 ? mae.toFixed(3) + '円' : '— (観測中)'}</b></span>` +
    (accuracy !== null ? `<span>予想精度: <b>${accuracy.toFixed(0)}%</b></span>` : '');

  // 集計
  let buys = 0, wins = 0, profCount = 0, lossCount = 0;
  let buyPl = 0, sellPl = 0, totalPl = 0;
  const p = livePrice;
  const heat = new Map(); // 建値ヒートマップ: 0.10円バンド -> 人数
  for (let i = 0; i < TOTAL; i++) {
    const t = traders[i];
    if (t.dir === 'buy') buys++;
    if (t.pl > 0) { wins++; profCount++; } else if (t.pl < 0) { lossCount++; }
    if (t.dir === 'buy') buyPl += t.pl; else sellPl += t.pl;
    totalPl += t.pl;
    const band = Math.round(Math.floor(t.entry * 10) / 10 * 10) / 10; // 0.10円刻み
    heat.set(band, (heat.get(band) || 0) + 1);
  }
  const sells = TOTAL - buys;
  const winRate = Math.round(wins / TOTAL * 100);
  const buyPct = (buys / TOTAL * 100);
  const sellPct = 100 - buyPct;
  const profitPct = (profCount / TOTAL * 100);
  const lossPct = (lossCount / TOTAL * 100);

  // メトリクス
  document.getElementById('m-buy').textContent = fmt(buys);
  document.getElementById('m-sell').textContent = fmt(sells);
  document.getElementById('m-win').textContent = winRate + '%';

  // センチメントバー
  const sb = document.getElementById('s-buy'), ss = document.getElementById('s-sell');
  sb.style.width = buyPct.toFixed(1) + '%';
  ss.style.width = sellPct.toFixed(1) + '%';
  sb.textContent = '買い ' + buyPct.toFixed(1) + '%';
  ss.textContent = '売り ' + sellPct.toFixed(1) + '%';

  // 建値ヒートマップ（現在価格を中心に 0.10円刻みで±0.5円、外側はまとめる）
  const center = Math.round(Math.floor(p * 10) / 10 * 10) / 10;
  let above = 0, below = 0;
  for (const [band, c] of heat) {
    if (band > center + 0.5 + 1e-9) above += c;
    else if (band < center - 0.5 - 1e-9) below += c;
  }
  const rows = [];
  rows.push({ rng: `≥ ${(center + 0.6).toFixed(2)}`, c: above, edge: true });
  for (let k = 5; k >= -5; k--) {
    const band = Math.round((center + k * 0.1) * 10) / 10;
    rows.push({
      rng: `${band.toFixed(2)}〜${(band + 0.1).toFixed(2)}`,
      c: heat.get(band) || 0,
      cur: Math.abs(band - center) < 1e-9
    });
  }
  rows.push({ rng: `< ${(center - 0.5).toFixed(2)}`, c: below, edge: true });
  const maxRow = Math.max(...rows.map(r => r.c), 1);
  document.getElementById('dist').innerHTML = rows.map(r =>
    `<div class="dist-row${r.cur ? ' cur' : ''}">
       <span class="rng">${r.rng}</span>
       <span class="track"><span class="fill" style="width:${(r.c/maxRow*100).toFixed(1)}%"></span></span>
       <span class="cnt">${fmt(r.c)}</span>
     </div>`).join('');

  // 損益サマリー
  const plRow = (k, v, colored) => {
    const cls = colored ? (v >= 0 ? 'pos' : 'neg') : '';
    const txt = colored ? sign(v) + '円' : fmt(v);
    return `<div class="pl-row"><span class="k">${k}</span><span class="v ${cls}">${txt}</span></div>`;
  };
  document.getElementById('plsummary').innerHTML =
    `<div class="pl-row"><span class="k">利益中トレーダー数</span><span class="v pos">${fmt(profCount)} (${profitPct.toFixed(1)}%)</span></div>` +
    `<div class="pl-row"><span class="k">損失中トレーダー数</span><span class="v neg">${fmt(lossCount)} (${lossPct.toFixed(1)}%)</span></div>` +
    `<div class="pl-row"><span class="k">勝率</span><span class="v">${winRate}%</span></div>` +
    plRow('買い勢損益合計', buyPl, true) +
    plRow('売り勢損益合計', sellPl, true) +
    plRow('全体損益合計', totalPl, true);

  // トレーダーリスト 上位20件（|pl|降順）
  const top = traders.slice().sort((a,b) => Math.abs(b.pl) - Math.abs(a.pl)).slice(0, 20);
  document.getElementById('tlist').innerHTML = top.map(t =>
    `<tr>
       <td class="mono">${t.id}</td>
       <td><span class="typebadge ${t.type}">${TYPE_LABEL[t.type]}</span></td>
       <td><span class="dirbadge ${t.dir}">${t.dir === 'buy' ? '買い' : '売り'}</span></td>
       <td class="mono num">${t.entry.toFixed(3)}</td>
       <td class="num">${t.lot.toFixed(1)}</td>
       <td class="mono num ${t.pl >= 0 ? 'pos' : 'neg'}">${sign(t.pl)}</td>
       <td>${t.status}</td>
     </tr>`).join('');
}

/* ===================== サイクル ===================== */
// Twelve Data から実5分足を取得して反映（自動更新の本体）
async function pollTwelveData() {
  const candles = await fetchTwelveData();
  if (candles) {
    dataSource = 'twelvedata';
    rateStatus = 'live';
    lastPollAt = Date.now();
    ingestRealCandles(candles);
    rebuildForecast();
    saveState();
    renderChart();
    genTraders();
    updateUI();
    return true;
  }
  // 失敗時は既存データを維持（キーが無ければ疑似モードのまま）
  updateUI();
  return false;
}

// APIキーがある場合のみ自動ポーリングを開始
function startPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (getApiKey()) pollTimer = setInterval(pollTwelveData, POLL_MS);
}

// 疑似モードの初期化（APIキー未設定 or 取得失敗時）
async function fetchAndInit() {
  if (rateStatus !== 'live') { rateStatus = 'loading'; updateBadgeOnly(); }
  const rate = await fetchLiveRate();
  if (rate !== null) { livePrice = rate; rateStatus = 'live'; }
  else if (rateStatus !== 'live') { rateStatus = 'pseudo'; }
  if (realCandles.length === 0 && !loadState()) seedRealCandles(livePrice);
  syncForming();
  rebuildForecast();
  saveState();
  genTraders();
  renderChart();
  updateUI();
}

function updateBadgeOnly() {
  const badge = document.getElementById('h-badge');
  badge.textContent = '⏳ 取得中'; badge.className = 'badge pseudo';
}

function tick() {
  // Twelve Data モードでは実足はポーリングで更新。3秒ごとはトレーダー再生成と時刻更新のみ
  if (dataSource !== 'twelvedata') {
    livePrice = r3(livePrice + (Math.random() * 2 - 1) * 0.012); // 疑似モードの微変動
    syncForming();      // 実績足を進める＋足が確定したら誤差を学習
    rebuildForecast();  // 学習結果で予想を引き直す
    saveState();
    renderChart();
  }
  genTraders();
  updateUI();
}

/* ===================== APIキー設定 UI ===================== */
function refreshKeyUI() {
  const has = !!getApiKey();
  document.getElementById('key-status').textContent = has
    ? `Twelve Data 連携中（約${Math.round(POLL_MS / 1000)}秒ごと自動更新）`
    : 'APIキー未設定 → 疑似データで動作中';
  document.getElementById('btn-key').textContent = has ? 'キー変更' : 'キー設定';
}

document.getElementById('btn-key').addEventListener('click', async () => {
  const cur = getApiKey();
  const k = prompt('Twelve Data の API キーを入力（無料登録: twelvedata.com）', cur);
  if (k === null) return; // キャンセル
  setApiKey(k.trim());
  refreshKeyUI();
  if (getApiKey()) {
    rateStatus = 'loading'; updateBadgeOnly();
    await pollTwelveData();
    startPolling();
  } else {
    dataSource = 'synthetic';
  }
});

/* ===================== イベント ===================== */
document.getElementById('btn-refresh').addEventListener('click', async () => {
  if (getApiKey()) { await pollTwelveData(); } else { await fetchAndInit(); }
});

window.addEventListener('resize', positionBoundary);

/* ===================== 起動 ===================== */
(async function startup() {
  loadState();          // 保存済みの実績・学習状態を先に復元
  refreshKeyUI();
  if (getApiKey()) {
    const ok = await pollTwelveData(); // 初回即時取得
    if (!ok) await fetchAndInit();     // 失敗時は疑似で起動
    startPolling();
  } else {
    await fetchAndInit();              // キー未設定は従来どおり疑似
  }
})();
setInterval(tick, 3000);
