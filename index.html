<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USD/JPY FX Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --up: #1D9E75;
  --down: #E24B4A;
  --blue: #378ADD;
  --bg: #0e131a;
  --panel: #161d27;
  --panel2: #1d2632;
  --line: #2a3440;
  --txt: #e8edf2;
  --muted: #93a1b0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--txt);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  line-height: 1.5;
  padding: 16px;
}
.wrap { max-width: 1200px; margin: 0 auto; }

/* ヘッダー */
header {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 14px;
  padding: 16px 18px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; margin-bottom: 16px;
}
.price { font-size: 38px; font-weight: 700; letter-spacing: -0.5px; }
.price .unit { font-size: 18px; color: var(--muted); margin-left: 4px; font-weight: 500; }
.change { font-size: 16px; font-weight: 600; }
.badge {
  font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
  background: var(--panel2); color: var(--muted);
}
.badge.live { background: #E1F5EE; color: #0F6E56; }
.badge.pseudo { background: #FAEEDA; color: #854F0B; }
.updated { margin-left: auto; font-size: 12px; color: var(--muted); }
.pos { color: var(--up); }
.neg { color: var(--down); }

/* メトリクスカード */
.metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.card .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.card .val { font-size: 24px; font-weight: 700; }

/* セクション */
.section-title { font-size: 15px; font-weight: 700; margin: 8px 0 10px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 18px; }

/* チャート1:1横並び */
.charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
.chart-col { min-width: 0; }
.chart-area { position: relative; height: 340px; }
#boundary { position: absolute; top: 0; width: 0; border-left: 2px dashed rgba(255,180,0,0.6); pointer-events: none; }
#boundary-label {
  position: absolute; top: 4px; transform: translateX(-50%);
  font-size: 11px; color: rgba(255,180,0,0.95); white-space: nowrap;
  background: rgba(14,19,26,0.7); padding: 2px 6px; border-radius: 4px; pointer-events: none;
}
.legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.legend .item { display: flex; align-items: center; gap: 6px; }
.legend .sw { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }

/* 予想指標（横並びカード） */
.stats-row {
  display: flex; flex-wrap: wrap; gap: 12px;
}
.stat-card {
  flex: 1 1 140px; min-width: 120px;
  background: var(--panel2); border-radius: 10px; padding: 12px 14px; text-align: center;
}
.stat-card .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.stat-card .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat-card .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* センチメントバー */
.sentiment { display: flex; height: 34px; border-radius: 8px; overflow: hidden; margin-bottom: 4px; }
.sentiment .buy { background: var(--up); }
.sentiment .sell { background: var(--down); }
.sentiment span {
  display: flex; align-items: center; justify-content: center; color: #fff;
  font-size: 13px; font-weight: 700; transition: width 0.6s ease;
}
.sentiment-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

/* 2カラム */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

/* ヒートマップ */
.dist-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 12px; }
.dist-row .rng { width: 120px; color: var(--muted); flex-shrink: 0; font-variant-numeric: tabular-nums; }
.dist-row .track { flex: 1; background: var(--panel2); border-radius: 5px; height: 16px; overflow: hidden; }
.dist-row .fill { height: 100%; background: var(--blue); border-radius: 5px; transition: width 0.5s ease; }
.dist-row .cnt { width: 60px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.dist-row.cur .rng { color: rgba(255,180,0,0.95); font-weight: 700; }
.dist-row.cur .fill { background: rgba(255,180,0,0.8); }

/* 損益サマリー */
.pl-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.pl-row:last-child { border-bottom: none; }
.pl-row .k { color: var(--muted); }
.pl-row .v { font-weight: 700; font-variant-numeric: tabular-nums; }

/* テーブル */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td.mono, th.mono { font-family: "SF Mono", Consolas, Menlo, monospace; font-variant-numeric: tabular-nums; }
.num { text-align: right; }
.dirbadge { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
.dirbadge.buy { background: rgba(29,158,117,0.18); color: var(--up); }
.dirbadge.sell { background: rgba(226,75,74,0.18); color: var(--down); }
.typebadge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--panel2); color: var(--muted); }
.typebadge.scalper { color: #5bbcff; }
.typebadge.dayTrader { color: #7dd3a8; }
.typebadge.swingTrader { color: #c8a8ff; }
.typebadge.gambler { color: #ffb347; }
.typebadge.pro { color: #ffd700; }
.table-scroll { overflow-x: auto; }

/* 操作ボタン */
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.btn {
  background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 18px; font-size: 13px; cursor: pointer; font-weight: 600;
  transition: all .15s;
}
.btn:hover { border-color: var(--blue); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.key-status { display: inline-flex; align-items: center; font-size: 12px; color: var(--muted); }

@media (max-width: 900px) {
  .charts-grid { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .grid2 { grid-template-columns: 1fr; }
  .price { font-size: 30px; }
}
</style>
</head>
<body>
<div class="wrap">

  <!-- ヘッダー -->
  <header>
    <div class="price"><span id="h-price">---.---</span><span class="unit">円</span></div>
    <div class="change" id="h-change">--</div>
    <div class="badge" id="h-badge">⏳ 取得中</div>
    <div class="updated" id="h-updated">最終更新: --:--:--</div>
  </header>

  <!-- メトリクスカード -->
  <div class="metrics">
    <div class="card"><div class="label">総トレーダー</div><div class="val" id="m-total">50,000</div></div>
    <div class="card"><div class="label">買い</div><div class="val pos" id="m-buy">--</div></div>
    <div class="card"><div class="label">売り</div><div class="val neg" id="m-sell">--</div></div>
    <div class="card"><div class="label">勝率</div><div class="val" id="m-win">--%</div></div>
  </div>

  <!-- チャート1:1 -->
  <div class="charts-grid">
    <div class="chart-col">
      <div class="section-title">リアルタイム ドル円（5分足・実績）</div>
      <div class="panel">
        <div class="chart-area"><canvas id="chart-live"></canvas></div>
        <div class="legend">
          <div class="item"><span class="sw" style="background:rgba(29,158,117,0.85)"></span>陽線</div>
          <div class="item"><span class="sw" style="background:rgba(226,75,74,0.85)"></span>陰線</div>
          <div class="item">Twelve Data 約108秒ごと更新</div>
        </div>
      </div>
    </div>
    <div class="chart-col">
      <div class="section-title">予想 ドル円（5分足・自己学習）</div>
      <div class="panel">
        <div class="chart-area">
          <canvas id="chart-pred"></canvas>
          <div id="boundary"></div>
          <div id="boundary-label">← 実績 │ 予想 →</div>
        </div>
        <div class="legend">
          <div class="item"><span class="sw" style="background:rgba(29,158,117,0.85)"></span>実績</div>
          <div class="item"><span class="sw" style="background:rgba(29,158,117,0.35)"></span>予想</div>
          <div class="item" id="forecast-brief"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 予想指標 -->
  <div class="section-title">予想精度・学習状況</div>
  <div class="panel">
    <div class="stats-row" id="forecast-stats"></div>
  </div>

  <!-- センチメントバー -->
  <div class="section-title">市場センチメント</div>
  <div class="panel">
    <div class="sentiment">
      <span class="buy" id="s-buy" style="width:50%">買い 50%</span>
      <span class="sell" id="s-sell" style="width:50%">売り 50%</span>
    </div>
    <div class="sentiment-legend"><span>買い (Long)</span><span>売り (Short)</span></div>
  </div>

  <!-- 2カラム -->
  <div class="grid2">
    <div>
      <div class="section-title">建値ヒートマップ</div>
      <div class="panel" id="dist"></div>
    </div>
    <div>
      <div class="section-title">損益サマリー</div>
      <div class="panel" id="plsummary"></div>
    </div>
  </div>

  <!-- トレーダーリスト -->
  <div class="section-title">トレーダーリスト（損益上位20件）</div>
  <div class="panel table-scroll">
    <table>
      <thead>
        <tr>
          <th class="mono">ID</th><th>タイプ</th><th>方向</th>
          <th class="mono num">エントリー</th><th class="num">ロット</th>
          <th class="mono num">損益(円)</th><th>状態</th>
        </tr>
      </thead>
      <tbody id="tlist"></tbody>
    </table>
  </div>

  <!-- 操作ボタン -->
  <div class="actions">
    <button class="btn primary" id="btn-refresh">↻ 手動更新</button>
    <button class="btn" id="btn-key">キー設定</button>
    <span class="key-status" id="key-status"></span>
  </div>

</div>

<script>
/* ========== 定数 ========== */
const TOTAL = 50000;
const REAL_COUNT = 48;
const FORECAST_COUNT = 12;
const LEARN_RATE = 0.2;
const TF_MIN = 5;
const BUCKET_MS = TF_MIN * 60 * 1000;

// Twelve Data
const TD_BASE = 'https://api.twelvedata.com/time_series';
const TD_SYMBOL = 'USD/JPY';
const FREE_DAILY = 800;
const POLL_MS = Math.ceil(86400 / FREE_DAILY) * 1000; // 約108秒
const TD_KEY_STORE = 'td-api-key';
const TD_DEFAULT_KEY = 'e248cffad6264d55b3c264b47b0c7f5f';

// 色
const C_UP_R = 'rgba(29,158,117,0.85)';
const C_DN_R = 'rgba(226,75,74,0.85)';
const C_UP_F = 'rgba(29,158,117,0.35)';
const C_DN_F = 'rgba(226,75,74,0.35)';

// トレーダー設定
const LOT_TABLE = [
  { lot: 0.1, w: 30 }, { lot: 0.2, w: 20 }, { lot: 0.3, w: 10 },
  { lot: 0.5, w: 15 }, { lot: 1.0, w: 15 }, { lot: 2.0, w: 7 }, { lot: 5.0, w: 3 }
];
const TYPE_TABLE = [
  { type: 'scalper', label: 'スキャル', w: 40, dist: 0.10 },
  { type: 'dayTrader', label: 'デイ', w: 30, dist: 0.50 },
  { type: 'swingTrader', label: 'スイング', w: 15, dist: 3.00 },
  { type: 'gambler', label: 'ギャンブラー', w: 10, dist: 1.00, lotMul: 2 },
  { type: 'pro', label: 'プロ', w: 5, dist: 0.30 }
];
const TYPE_LABEL = Object.fromEntries(TYPE_TABLE.map(t => [t.type, t.label]));
const WIN_RATIO = 0.25;

/* ========== 状態 ========== */
let livePrice = 155.0;
let rateStatus = 'loading';
let dataSource = 'synthetic';
let realCandles = [];
let forecastCandles = [];
let drift = 0, lastDeviation = 0;
let mae = 0, maeN = 0;
let hits = 0, hitN = 0;
let lastClosedBucket = null;
let tdError = '';
let pollTimer = null;
let traders = [];
let chartLive = null, chartPred = null;

const STORE_KEY = 'fx-dashboard-v3';

/* ========== ユーティリティ ========== */
const r3 = v => parseFloat(v.toFixed(3));
const fmt = n => n.toLocaleString('en-US');
const sign = n => (n >= 0 ? '+' : '') + fmt(n);
const bucketOf = t => Math.floor(t / BUCKET_MS);

function pickWeighted(table, wKey = 'w') {
  let total = 0;
  for (const e of table) total += e[wKey];
  let r = Math.random() * total;
  for (const e of table) if ((r -= e[wKey]) < 0) return e;
  return table[table.length - 1];
}

function gaussian(mean = 0, sigma = 1) {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return mean + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/* ========== APIキー ========== */
const getApiKey = () => { try { return localStorage.getItem(TD_KEY_STORE) || TD_DEFAULT_KEY; } catch { return TD_DEFAULT_KEY; } };
const setApiKey = k => { try { localStorage.setItem(TD_KEY_STORE, k); } catch {} };

/* ========== 為替レート取得（フォールバック用） ========== */
async function fetchFallbackRate() {
  const urls = [
    'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json',
    'https://latest.currency-api.pages.dev/v1/currencies/usd.min.json'
  ];
  for (const url of urls) {
    try {
      const r = await fetch(url);
      if (!r.ok) continue;
      const d = await r.json();
      if (d?.usd?.jpy) return r3(d.usd.jpy);
    } catch {}
  }
  return null;
}

/* ========== Twelve Data ========== */
async function fetchTwelveData() {
  const key = getApiKey();
  if (!key) return null;
  const url = `${TD_BASE}?symbol=${encodeURIComponent(TD_SYMBOL)}&interval=5min&outputsize=${REAL_COUNT}&timezone=UTC&format=JSON&apikey=${encodeURIComponent(key)}`;
  try {
    const r = await fetch(url);
    const d = await r.json();
    if (d.status === 'error' || !Array.isArray(d.values)) { tdError = d.message || 'APIエラー'; return null; }
    tdError = '';
    const candles = d.values.slice().reverse().map(v => {
      const t = new Date(v.datetime.replace(' ', 'T') + 'Z').getTime();
      return { bucket: bucketOf(t), t, o: r3(+v.open), h: r3(+v.high), l: r3(+v.low), c: r3(+v.close), forming: false };
    });
    candles[candles.length - 1].forming = true;
    return candles;
  } catch { tdError = '通信エラー'; return null; }
}

/* ========== 学習 ========== */
const DEAD = 0.005;
const dir3 = x => x > DEAD ? 1 : (x < -DEAD ? -1 : 0);

function recordHit(predicted, realized) {
  hitN++;
  if (dir3(predicted) === dir3(realized)) hits++;
}

function learnFromClosed(closedCandle) {
  const realized = closedCandle.c - closedCandle.o;
  if (lastClosedBucket !== null && closedCandle.bucket !== lastClosedBucket) {
    const err = realized - drift;
    lastDeviation = r3(closedCandle.c - (closedCandle.o + drift));
    recordHit(drift, realized);
    maeN++; mae = mae + (Math.abs(err) - mae) / maeN;
  }
  drift = drift + LEARN_RATE * (realized - drift);
  lastClosedBucket = closedCandle.bucket;
}

/* ========== ロウソク足生成 ========== */
function seedRealCandles(basePrice) {
  realCandles = [];
  lastClosedBucket = null;
  const k = Math.sqrt(TF_MIN);
  const nowB = bucketOf(Date.now());
  let price = basePrice - (Math.random() * 0.8 + 0.2);
  for (let i = REAL_COUNT - 1; i >= 0; i--) {
    const o = price;
    const c = (i === 0) ? basePrice : o + (Math.random() * 2 - 1) * 0.07 * k;
    const h = Math.max(o, c) + Math.random() * 0.035 * k;
    const l = Math.min(o, c) - Math.random() * 0.035 * k;
    const b = nowB - i;
    realCandles.push({ bucket: b, o: r3(o), h: r3(h), l: r3(l), c: r3(c), t: b * BUCKET_MS, forming: i === 0 });
    price = c;
  }
}

function syncForming() {
  const nowB = bucketOf(Date.now());
  let cur = realCandles[realCandles.length - 1];
  if (nowB - cur.bucket > 3) { seedRealCandles(livePrice); return; }
  while (cur.bucket < nowB) {
    cur.forming = false;
    learnFromClosed(cur);
    const o = cur.c;
    cur = { bucket: cur.bucket + 1, o, h: o, l: o, c: o, t: (cur.bucket + 1) * BUCKET_MS, forming: true };
    realCandles.push(cur);
    if (realCandles.length > REAL_COUNT) realCandles.shift();
  }
  cur.c = livePrice;
  cur.h = r3(Math.max(cur.h, livePrice, cur.o));
  cur.l = r3(Math.min(cur.l, livePrice, cur.o));
}

/* ========== テクニカル指標 ========== */
// 移動平均（単純）
function calcMA(period) {
  const closes = realCandles.filter(c => !c.forming).slice(-period).map(c => c.c);
  return closes.length >= period ? closes.reduce((a, b) => a + b, 0) / period : null;
}

// RSI（相対力指数）
function calcRSI(period = 14) {
  const closes = realCandles.filter(c => !c.forming).map(c => c.c);
  if (closes.length < period + 1) return null;
  let gains = 0, losses = 0;
  for (let i = closes.length - period; i < closes.length; i++) {
    const diff = closes[i] - closes[i - 1];
    if (diff > 0) gains += diff; else losses -= diff;
  }
  if (losses === 0) return 100;
  const rs = gains / losses;
  return 100 - (100 / (1 + rs));
}

// ATR（平均真の範囲）
function calcATR(period = 14) {
  const candles = realCandles.filter(c => !c.forming);
  if (candles.length < period + 1) return null;
  let sum = 0;
  for (let i = candles.length - period; i < candles.length; i++) {
    const cur = candles[i], prev = candles[i - 1];
    const tr = Math.max(cur.h - cur.l, Math.abs(cur.h - prev.c), Math.abs(cur.l - prev.c));
    sum += tr;
  }
  return sum / period;
}

// 現在の指標をグローバルに保持（UI表示用）
let indicators = { maShort: null, maLong: null, rsi: null, atr: null, signal: 0 };

// 指標を計算してドリフトを補正
function calcIndicatorsAndAdjustDrift() {
  const maShort = calcMA(5);   // 短期MA（5本=25分）
  const maLong = calcMA(20);   // 長期MA（20本=100分）
  const rsi = calcRSI(14);
  const atr = calcATR(14);

  indicators = { maShort, maLong, rsi, atr, signal: 0 };

  let adjustedDrift = drift;
  let signal = 0;

  // MAクロス: 短期 > 長期 なら上昇トレンド
  if (maShort !== null && maLong !== null) {
    const maDiff = (maShort - maLong) / maLong * 100; // %差
    if (maDiff > 0.02) { signal += 1; adjustedDrift += 0.003; }      // 上昇トレンド
    else if (maDiff < -0.02) { signal -= 1; adjustedDrift -= 0.003; } // 下降トレンド
  }

  // RSI: 過熱感で反転を予測
  if (rsi !== null) {
    if (rsi > 70) { signal -= 1; adjustedDrift -= 0.004; }        // 買われすぎ → 下落予測
    else if (rsi < 30) { signal += 1; adjustedDrift += 0.004; }   // 売られすぎ → 上昇予測
  }

  indicators.signal = signal;
  return { adjustedDrift, atr };
}

function rebuildForecast() {
  const cur = realCandles[realCandles.length - 1];
  const k = Math.sqrt(TF_MIN);
  const { adjustedDrift, atr } = calcIndicatorsAndAdjustDrift();

  // ATRでボラティリティに応じた不確実性コーンを調整
  const volBase = atr !== null ? atr : 0.05;

  forecastCandles = [];
  let o = cur.c;
  for (let i = 0; i < FORECAST_COUNT; i++) {
    const c = o + adjustedDrift;
    // 先の足ほど広がる不確実性コーン（ATRベース）
    const band = volBase * (0.3 + 0.15 * i);
    const h = Math.max(o, c) + band;
    const l = Math.min(o, c) - band;
    forecastCandles.push({ o: r3(o), h: r3(h), l: r3(l), c: r3(c), t: (cur.bucket + 1 + i) * BUCKET_MS, forecast: true });
    o = c;
  }
}

function predCandles() { return realCandles.concat(forecastCandles); }

/* ========== 永続化 ========== */
function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ realCandles, drift, mae, maeN, hits, hitN, lastClosedBucket }));
  } catch {}
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (!s || !Array.isArray(s.realCandles) || s.realCandles.length === 0) return false;
    realCandles = s.realCandles;
    drift = s.drift || 0;
    mae = s.mae || 0;
    maeN = s.maeN || 0;
    hits = s.hits || 0;
    hitN = s.hitN || 0;
    lastClosedBucket = s.lastClosedBucket ?? null;
    return true;
  } catch { return false; }
}

/* ========== トレーダー生成 ========== */
function genTraders() {
  const arr = new Array(TOTAL);
  const p = livePrice;
  for (let i = 0; i < TOTAL; i++) {
    const tp = pickWeighted(TYPE_TABLE);
    const dir = Math.random() < 0.53 ? 'buy' : 'sell';
    let lot = pickWeighted(LOT_TABLE).lot;
    if (tp.lotMul) lot = parseFloat((lot * tp.lotMul).toFixed(1));
    const winner = Math.random() < WIN_RATIO;
    const mag = Math.abs(gaussian(0, tp.dist / 2));
    const entryBelow = dir === 'buy' ? winner : !winner;
    let entry = Number((entryBelow ? p - mag : p + mag).toFixed(3));
    const pips = dir === 'buy' ? (p - entry) * 100 : (entry - p) * 100;
    let pl = Math.round(pips * lot * 100);
    if (winner && pl <= 0) pl = 1;
    if (!winner && pl >= 0) pl = -1;
    let status = pl >= 1000 ? 'TP待ち' : (pl <= -1000 ? 'SL接近' : 'オープン');
    arr[i] = { id: 'T' + String(i + 1).padStart(5, '0'), type: tp.type, dir, entry, lot, pl, status };
  }
  traders = arr;
}

/* ========== Chart.js ========== */
function buildDatasets(candles) {
  const wick = [], body = [], wickColors = [], bodyColors = [], labels = [];
  let lo = Infinity, hi = -Infinity;
  candles.forEach(cd => {
    const up = cd.c >= cd.o;
    const col = cd.forecast ? (up ? C_UP_F : C_DN_F) : (up ? C_UP_R : C_DN_R);
    wick.push([cd.l, cd.h]);
    body.push([cd.o, cd.c]);
    wickColors.push(col);
    bodyColors.push(col);
    const d = new Date(cd.t);
    labels.push(`${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`);
    if (cd.l < lo) lo = cd.l;
    if (cd.h > hi) hi = cd.h;
  });
  const pad = Math.max((hi - lo) * 0.08, 0.02);
  return { labels, wick, body, wickColors, bodyColors, yMin: lo - pad, yMax: hi + pad };
}

function tooltipConfig(getCandles) {
  return {
    filter: item => item.datasetIndex === 1,
    callbacks: {
      title: items => {
        const cd = getCandles()[items[0].dataIndex];
        return `${items[0].label} ${cd.forecast ? '【予想】' : '【実績】'}`;
      },
      label: item => {
        const cd = getCandles()[item.dataIndex];
        return [`始値: ${cd.o.toFixed(3)}`, `高値: ${cd.h.toFixed(3)}`, `安値: ${cd.l.toFixed(3)}`, `終値: ${cd.c.toFixed(3)}`];
      }
    }
  };
}

function makeChart(canvasId, getCandles, onComplete) {
  const { labels, wick, body, wickColors, bodyColors, yMin, yMax } = buildDatasets(getCandles());
  const ctx = document.getElementById(canvasId).getContext('2d');
  return new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'wick', data: wick, backgroundColor: wickColors, barPercentage: 0.15, categoryPercentage: 0.9, order: 2 },
        { label: 'body', data: body, backgroundColor: bodyColors, barPercentage: 0.6, categoryPercentage: 0.9, order: 1 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 100, onComplete },
      scales: {
        y: { beginAtZero: false, min: yMin, max: yMax, ticks: { color: '#93a1b0', callback: v => v.toFixed(2) }, grid: { color: 'rgba(255,255,255,0.05)' } },
        x: { ticks: { color: '#93a1b0', maxTicksLimit: 8, autoSkip: true }, grid: { display: false } }
      },
      plugins: { legend: { display: false }, tooltip: tooltipConfig(getCandles) }
    }
  });
}

function updateChart(chart, getCandles) {
  const { labels, wick, body, wickColors, bodyColors, yMin, yMax } = buildDatasets(getCandles());
  chart.data.labels = labels;
  chart.data.datasets[0].data = wick;
  chart.data.datasets[0].backgroundColor = wickColors;
  chart.data.datasets[1].data = body;
  chart.data.datasets[1].backgroundColor = bodyColors;
  chart.options.scales.y.min = yMin;
  chart.options.scales.y.max = yMax;
  chart.update();
}

function positionBoundary() {
  if (!chartPred) return;
  const area = chartPred.chartArea;
  const xScale = chartPred.scales.x;
  if (!area || !xScale) return;
  const x = xScale.getPixelForValue(realCandles.length - 0.5);
  const bd = document.getElementById('boundary');
  const lb = document.getElementById('boundary-label');
  bd.style.left = x + 'px';
  bd.style.top = area.top + 'px';
  bd.style.height = (area.bottom - area.top) + 'px';
  lb.style.left = x + 'px';
}

function renderChart() {
  if (!chartLive) {
    chartLive = makeChart('chart-live', () => realCandles, null);
    chartPred = makeChart('chart-pred', () => predCandles(), positionBoundary);
  } else {
    updateChart(chartLive, () => realCandles);
    updateChart(chartPred, () => predCandles());
  }
  positionBoundary();
}

/* ========== UI更新 ========== */
function updateUI() {
  const base = realCandles.length ? realCandles[0].o : livePrice;
  const diff = livePrice - base;
  const pct = base ? (diff / base) * 100 : 0;

  document.getElementById('h-price').textContent = livePrice.toFixed(3);
  const ch = document.getElementById('h-change');
  ch.textContent = `${diff >= 0 ? '+' : ''}${diff.toFixed(3)}円 (${diff >= 0 ? '+' : ''}${pct.toFixed(2)}%)`;
  ch.className = 'change ' + (diff >= 0 ? 'pos' : 'neg');

  const badge = document.getElementById('h-badge');
  if (rateStatus === 'loading') { badge.textContent = '⏳ 取得中'; badge.className = 'badge pseudo'; }
  else if (dataSource === 'twelvedata') { badge.textContent = '🟢 Twelve Data'; badge.className = 'badge live'; }
  else { badge.textContent = tdError ? `⚠ ${tdError}` : '⚠ 疑似データ'; badge.className = 'badge pseudo'; }

  document.getElementById('h-updated').textContent = `最終更新: ${new Date().toTimeString().slice(0, 8)}`;

  // 予想（凡例内に簡潔表示）
  const target = forecastCandles.length ? forecastCandles[forecastCandles.length - 1].c : livePrice;
  const fdiff = target - livePrice;
  const arrow = fdiff > 0.005 ? '↑' : (fdiff < -0.005 ? '↓' : '→');
  const fcls = fdiff > 0.005 ? 'pos' : (fdiff < -0.005 ? 'neg' : '');
  document.getElementById('forecast-brief').innerHTML =
    `<span class="${fcls}" style="font-weight:600">${FORECAST_COUNT * TF_MIN}分後 ${arrow} ${target.toFixed(3)}（${fdiff >= 0 ? '+' : ''}${fdiff.toFixed(3)}円）</span>`;

  // 予想指標（カード形式）- テクニカル指標も表示
  const matchRate = hitN > 0 ? (hits / hitN * 100) : null;
  const mcls = matchRate === null ? '' : (matchRate >= 50 ? 'pos' : 'neg');
  const { maShort, maLong, rsi, atr, signal } = indicators;
  const sigText = signal > 0 ? '↑買い優勢' : (signal < 0 ? '↓売り優勢' : '→中立');
  const sigCls = signal > 0 ? 'pos' : (signal < 0 ? 'neg' : '');
  const rsiCls = rsi !== null ? (rsi > 70 ? 'neg' : (rsi < 30 ? 'pos' : '')) : '';
  document.getElementById('forecast-stats').innerHTML =
    `<div class="stat-card"><div class="label">整合率</div><div class="val ${mcls}">${matchRate !== null ? matchRate.toFixed(0) + '%' : '—'}</div><div class="sub">${hitN > 0 ? `${hits}/${hitN}足` : '観測中'}</div></div>` +
    `<div class="stat-card"><div class="label">60分後予想</div><div class="val ${fcls}">${target.toFixed(2)}</div><div class="sub">${fdiff >= 0 ? '+' : ''}${fdiff.toFixed(3)}円</div></div>` +
    `<div class="stat-card"><div class="label">シグナル</div><div class="val ${sigCls}">${sigText}</div><div class="sub">MA+RSI</div></div>` +
    `<div class="stat-card"><div class="label">RSI(14)</div><div class="val ${rsiCls}">${rsi !== null ? rsi.toFixed(0) : '—'}</div><div class="sub">${rsi !== null ? (rsi > 70 ? '買われすぎ' : (rsi < 30 ? '売られすぎ' : '中立')) : ''}</div></div>` +
    `<div class="stat-card"><div class="label">MA短期/長期</div><div class="val">${maShort !== null ? maShort.toFixed(2) : '—'}</div><div class="sub">${maLong !== null ? maLong.toFixed(2) : '—'}</div></div>` +
    `<div class="stat-card"><div class="label">ATR(14)</div><div class="val">${atr !== null ? atr.toFixed(3) : '—'}</div><div class="sub">ボラティリティ</div></div>` +
    `<div class="stat-card"><div class="label">MAE</div><div class="val">${maeN > 0 ? mae.toFixed(3) : '—'}</div><div class="sub">${maeN > 0 ? '円' : '観測中'}</div></div>`;

  // トレーダー集計
  let buys = 0, profCount = 0, lossCount = 0, buyPl = 0, sellPl = 0, totalPl = 0;
  const p = livePrice;
  const heat = new Map();
  for (const t of traders) {
    if (t.dir === 'buy') buys++;
    if (t.pl > 0) profCount++; else if (t.pl < 0) lossCount++;
    if (t.dir === 'buy') buyPl += t.pl; else sellPl += t.pl;
    totalPl += t.pl;
    const band = Math.round(Math.floor(t.entry * 10) / 10 * 10) / 10;
    heat.set(band, (heat.get(band) || 0) + 1);
  }
  const sells = TOTAL - buys;
  const winRate = Math.round(profCount / TOTAL * 100);
  const buyPct = buys / TOTAL * 100;
  const sellPct = 100 - buyPct;
  const profitPct = profCount / TOTAL * 100;
  const lossPct = lossCount / TOTAL * 100;

  document.getElementById('m-buy').textContent = fmt(buys);
  document.getElementById('m-sell').textContent = fmt(sells);
  document.getElementById('m-win').textContent = winRate + '%';

  const sb = document.getElementById('s-buy'), ss = document.getElementById('s-sell');
  sb.style.width = buyPct.toFixed(1) + '%';
  ss.style.width = sellPct.toFixed(1) + '%';
  sb.textContent = '買い ' + buyPct.toFixed(1) + '%';
  ss.textContent = '売り ' + sellPct.toFixed(1) + '%';

  // ヒートマップ
  const center = Math.round(Math.floor(p * 10) / 10 * 10) / 10;
  let above = 0, below = 0;
  for (const [band, c] of heat) {
    if (band > center + 0.5 + 1e-9) above += c;
    else if (band < center - 0.5 - 1e-9) below += c;
  }
  const rows = [{ rng: `≥ ${(center + 0.6).toFixed(2)}`, c: above, edge: true }];
  for (let k = 5; k >= -5; k--) {
    const band = Math.round((center + k * 0.1) * 10) / 10;
    rows.push({ rng: `${band.toFixed(2)}〜${(band + 0.1).toFixed(2)}`, c: heat.get(band) || 0, cur: Math.abs(band - center) < 1e-9 });
  }
  rows.push({ rng: `< ${(center - 0.5).toFixed(2)}`, c: below, edge: true });
  const maxRow = Math.max(...rows.map(r => r.c), 1);
  document.getElementById('dist').innerHTML = rows.map(r =>
    `<div class="dist-row${r.cur ? ' cur' : ''}"><span class="rng">${r.rng}</span><span class="track"><span class="fill" style="width:${(r.c / maxRow * 100).toFixed(1)}%"></span></span><span class="cnt">${fmt(r.c)}</span></div>`
  ).join('');

  // 損益サマリー
  const plRow = (k, v, colored) => {
    const cls = colored ? (v >= 0 ? 'pos' : 'neg') : '';
    const txt = colored ? sign(v) + '円' : fmt(v);
    return `<div class="pl-row"><span class="k">${k}</span><span class="v ${cls}">${txt}</span></div>`;
  };
  document.getElementById('plsummary').innerHTML =
    `<div class="pl-row"><span class="k">利益中</span><span class="v pos">${fmt(profCount)} (${profitPct.toFixed(1)}%)</span></div>` +
    `<div class="pl-row"><span class="k">損失中</span><span class="v neg">${fmt(lossCount)} (${lossPct.toFixed(1)}%)</span></div>` +
    `<div class="pl-row"><span class="k">勝率</span><span class="v">${winRate}%</span></div>` +
    plRow('買い勢合計', buyPl, true) + plRow('売り勢合計', sellPl, true) + plRow('全体合計', totalPl, true);

  // トレーダーリスト
  const top = traders.slice().sort((a, b) => Math.abs(b.pl) - Math.abs(a.pl)).slice(0, 20);
  document.getElementById('tlist').innerHTML = top.map(t =>
    `<tr><td class="mono">${t.id}</td><td><span class="typebadge ${t.type}">${TYPE_LABEL[t.type]}</span></td><td><span class="dirbadge ${t.dir}">${t.dir === 'buy' ? '買い' : '売り'}</span></td><td class="mono num">${t.entry.toFixed(3)}</td><td class="num">${t.lot.toFixed(1)}</td><td class="mono num ${t.pl >= 0 ? 'pos' : 'neg'}">${sign(t.pl)}</td><td>${t.status}</td></tr>`
  ).join('');
}

/* ========== サイクル ========== */
async function pollTwelveData() {
  const candles = await fetchTwelveData();
  if (candles && candles.length > 0) {
    dataSource = 'twelvedata';
    rateStatus = 'live';
    realCandles = candles;
    livePrice = candles[candles.length - 1].c;
    if (candles.length >= 2) learnFromClosed(candles[candles.length - 2]);
    rebuildForecast();
    saveState();
    renderChart();
    genTraders();
    updateUI();
    return true;
  }
  updateUI();
  return false;
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  if (getApiKey()) pollTimer = setInterval(pollTwelveData, POLL_MS);
}

async function initSynthetic() {
  if (rateStatus !== 'live') { rateStatus = 'loading'; updateBadgeOnly(); }
  const rate = await fetchFallbackRate();
  if (rate !== null) { livePrice = rate; rateStatus = 'live'; }
  else if (rateStatus !== 'live') rateStatus = 'pseudo';
  if (realCandles.length === 0) seedRealCandles(livePrice);
  syncForming();
  rebuildForecast();
  saveState();
  genTraders();
  renderChart();
  updateUI();
}

function updateBadgeOnly() {
  const badge = document.getElementById('h-badge');
  badge.textContent = '⏳ 取得中'; badge.className = 'badge pseudo';
}

function tick() {
  if (dataSource !== 'twelvedata') {
    livePrice = r3(livePrice + (Math.random() * 2 - 1) * 0.012);
    syncForming();
    rebuildForecast();
    saveState();
    renderChart();
  }
  genTraders();
  updateUI();
}

/* ========== キー設定UI ========== */
function refreshKeyUI() {
  const has = !!getApiKey();
  document.getElementById('key-status').textContent = has ? `連携中（約${Math.round(POLL_MS / 1000)}秒ごと）` : '未設定';
  document.getElementById('btn-key').textContent = has ? 'キー変更' : 'キー設定';
}

document.getElementById('btn-key').addEventListener('click', async () => {
  const k = prompt('Twelve Data の API キー', getApiKey());
  if (k === null) return;
  setApiKey(k.trim());
  refreshKeyUI();
  if (getApiKey()) { rateStatus = 'loading'; updateBadgeOnly(); await pollTwelveData(); startPolling(); }
  else { dataSource = 'synthetic'; }
});

document.getElementById('btn-refresh').addEventListener('click', async () => {
  if (getApiKey()) await pollTwelveData(); else await initSynthetic();
});

window.addEventListener('resize', positionBoundary);

/* ========== 起動 ========== */
(async function startup() {
  loadState();
  refreshKeyUI();
  if (getApiKey()) {
    const ok = await pollTwelveData();
    if (!ok) await initSynthetic();
    startPolling();
  } else {
    await initSynthetic();
  }
})();
setInterval(tick, 3000);
</script>
